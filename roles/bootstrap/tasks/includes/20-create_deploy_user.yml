---
- name: Create group for accept SSH connections
  ansible.builtin.group:
    name: "{{ bootstrap_ssh_users_group_name }}"
    state: present
  register: group_creation

- name: Create ansible management station's user and append them to groups
  ansible.builtin.user:
    name: "{{ bootstrap_deploy_user }}"
    state: present
    groups:
      - "{{ bootstrap_ssh_users_group_name }}"
      - sudo
    append: true
    password: "{{ bootstrap_deploy_user_password_hash | string | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: true

- name: Add user authorized key
  ansible.posix.authorized_key:
    user: "{{ bootstrap_deploy_user }}"
    key: "{{ lookup('file', bootstrap_deploy_user_ssh_key_file) }}"
  register: ssh_key_upload
