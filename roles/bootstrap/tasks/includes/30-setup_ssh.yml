---
- name: Secure SSH Daemon Configuration
  when:
    - group_creation is success
    - ssh_key_upload is success
  block:

    - name: Deploy main sshd_config with Include directive
      ansible.builtin.template:
        src: templates/ssh/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Deploy SSH security configuration into sshd_config.d
      ansible.builtin.template:
        src: templates/ssh/sshd_config.d/99-security.conf.j2
        dest: /etc/ssh/sshd_config.d/99-security.conf
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh
